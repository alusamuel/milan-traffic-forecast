[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milan-traffic-forecast"
version = "0.1.0"
description = "Reproducible comparison of linear, recurrent and convolutional one-step Milan traffic forecasts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.3,<2", "torch>=2.2,<3", "psutil>=5,<8"]

[project.scripts]
milan-forecast = "milan_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
